<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>關缺交叉分析 — HR Demo</title>
<style>
:root{
  --c1:#15436F;--c2:#2E6BA6;--c3:#5B95CC;--c4:#9DC2E6;--gray:#B7B5AC;
  --bg:#FFFFFF;--bg2:#F5F6F7;--text:#1A1A1A;--text2:#6B6B6B;--text3:#9A9A9A;
  --border:rgba(0,0,0,0.10);--tick:#8C8C8C;--grid:rgba(128,128,128,0.18);
}
*{box-sizing:border-box}
body{margin:0;padding:32px;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",Arial,sans-serif}
.page{max-width:920px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.sub{font-size:13px;color:var(--text2);margin:0 0 24px}
.block{margin-bottom:30px}
.title{font-size:14px;font-weight:600;margin:0 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px;font-size:12px;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:2px}
.wrap{position:relative;width:100%}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--bg2);border-radius:8px;padding:12px 14px}
.kpi .l{font-size:11px;color:var(--text2)}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px;color:var(--c1)}
.kpi .s{font-size:11px;color:var(--text2)}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--border)}
thead th{color:var(--text2);font-weight:500;font-size:12px;background:var(--bg2)}
.grp{text-align:left;font-weight:600}.sub-c{text-align:left;color:var(--text2)}
td.hit{background:rgba(46,107,166,0.14);font-weight:600}
td.zero{color:var(--text3)}
.rt,tfoot td{font-weight:600}tfoot td{background:var(--bg2)}
.note{font-size:12px;color:var(--text2);margin-top:12px;line-height:1.6}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
<div class="page">
  <h1>📊 關缺交叉分析 — HR Demo</h1>
  <p class="sub">範例資料 36 筆｜單一藍色家族配色（數量越多越深、未填灰）｜堆疊長條標人數、可四邊對帳</p>

  <div class="block">
    <p class="title">① 重點數字</p>
    <div class="kpis" id="kpis"></div>
  </div>

  <div class="block">
    <p class="title">② 職能 × 管道</p>
    <div class="legend" id="lg2"></div>
    <div class="wrap" id="bx2"><canvas id="m2"></canvas></div>
  </div>

  <div class="block">
    <p class="title">③ 職能 × 來源</p>
    <div class="legend" id="lg3"></div>
    <div class="wrap" id="bx3"><canvas id="m3"></canvas></div>
  </div>

  <div class="block">
    <p class="title">④ 職能 × 職等</p>
    <div class="legend" id="lg4"></div>
    <div class="wrap" id="bx4"><canvas id="m4"></canvas></div>
  </div>

  <div class="block">
    <p class="title">⑤ 職等 × 管道 × 來源（三維交叉表）</p>
    <div id="xtab"></div>
    <p class="note">淺藍格＝有人數的組合；每橫列、每直欄加總皆收斂到右下角總計，可四邊對帳。</p>
  </div>

  <div class="block">
    <p class="title">⑥ 月趨勢（依 Close Day）</p>
    <div class="wrap" style="height:220px"><canvas id="trend"></canvas></div>
  </div>
</div>

<script>
Chart.register(ChartDataLabels);
const TICK='#8C8C8C',GRID='rgba(128,128,128,0.18)',DARK='#15436F',LIGHT='#9DC2E6',GRAY='#B7B5AC';
// 範例資料（管道→職等/來源有相關性，控制組合數讓三維表乾淨）
const FUNCS=['行銷運營組','商務開發','銷售','PC組','後端工程'];
const RULES={
 '104':{lv:['2','3'],src:['主投','主管']},
 'LinkedIn':{lv:['4','5'],src:['獵才']},
 '內部推薦':{lv:['3','4'],src:['員工推薦','主管']},
 '獵頭':{lv:['5'],src:['獵才']},
};
const CH=Object.keys(RULES),MONTHS=['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ROWS=[];
for(let i=0;i<36;i++){const ch=pick(CH),r=RULES[ch];
  ROWS.push({func:pick(FUNCS),channel:ch,src:pick(r.src),level:pick(r.lv),status:pick(['錄取','錄取','補缺','內轉補缺']),
    close_day:pick(MONTHS)+'-15',days:18+Math.floor(Math.random()*40)});}

// ── 配色工具：藍色家族 ──
const hex2rgb=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16));};
const rgb2hex=a=>'#'+a.map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>rgb2hex(hex2rgb(a).map((x,i)=>x+(hex2rgb(b)[i]-x)*t));
const ramp=n=>n<=1?[DARK]:Array.from({length:n},(_,i)=>mix(DARK,LIGHT,i/(n-1)));
const isLight=h=>{const[r,g,b]=hex2rgb(h);return .299*r+.587*g+.114*b>150;};
const labelColor=h=>isLight(h)?'#15436F':'#fff';
const cnt=(f,v)=>ROWS.filter(r=>(r[f]||'未填')===v).length;
const orderLevels=ks=>{const n=ks.filter(k=>/^\d+$/.test(k)).sort((a,b)=>a-b);const it=ks.filter(k=>/intern/i.test(k));const bl=ks.filter(k=>k==='未填');return[...n,...it,...bl];};
// 統一配色：數量越多顏色越深（深→淺），未填固定灰
function colorByCount(f){
  const all=[...new Set(ROWS.map(r=>r[f]||'未填'))];
  const nonBlank=all.filter(k=>k!=='未填').sort((a,b)=>cnt(f,b)-cnt(f,a));  // 多→少
  const rp=ramp(nonBlank.length),color={};
  nonBlank.forEach((k,i)=>color[k]=rp[i]);                                  // 最多=最深
  const order=[...nonBlank];
  if(all.includes('未填')){color['未填']=GRAY;order.push('未填');}
  return{order,color};
}

// ① KPI
(function(){const n=ROWS.length,by=s=>ROWS.filter(r=>r.status===s).length,pct=x=>Math.round(x/n*100),avg=Math.round(ROWS.reduce((s,r)=>s+r.days,0)/n);
  const kp=[['總關缺數',n,''],['錄取',by('錄取'),pct(by('錄取'))+'%'],['補缺',by('補缺'),pct(by('補缺'))+'%'],['內轉補缺',by('內轉補缺'),pct(by('內轉補缺'))+'%'],['平均報到天數',avg+' 天','Close → 報到']];
  document.getElementById('kpis').innerHTML=kp.map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('');})();

// 共通：水平堆疊長條（絕對人數 + 數字標籤 + 「·列總」）
function stackRef(canvasId,legId,boxId,rowDim,segDim,segIsLevel){
  const rf={'職能':'func'}[rowDim]||rowDim, sf={'管道':'channel','來源':'src','職等':'level'}[segDim];
  const rowKeys=[...new Set(ROWS.map(r=>r[rf]||'未填'))].sort((a,b)=>cnt(rf,b)-cnt(rf,a));
  const {order:segKeys,color:cmap}=colorByCount(sf);   // 數量多→深，未填灰
  // legend
  document.getElementById(legId).innerHTML=segKeys.map(s=>`<span><span class="dot" style="background:${cmap[s]}"></span>${segIsLevel&&/^\d+$/.test(s)?'職等'+s:s}</span>`).join('');
  const rowTot=rowKeys.map(rk=>ROWS.filter(r=>(r[rf]||'未填')===rk).length);
  document.getElementById(boxId).style.height=(rowKeys.length*40+24)+'px';
  const datasets=segKeys.map(sv=>({label:segIsLevel&&/^\d+$/.test(sv)?'職等'+sv:sv,
    data:rowKeys.map(rk=>ROWS.filter(r=>(r[rf]||'未填')===rk&&(r[sf]||'未填')===sv).length),
    backgroundColor:cmap[sv],borderRadius:3,datalabels:{color:labelColor(cmap[sv])}}));
  new Chart(document.getElementById(canvasId),{type:'bar',
    data:{labels:rowKeys.map((rk,i)=>rk+' · '+rowTot[i]),datasets},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw>0?c.dataset.label+' '+c.raw+' 筆':null}},
        datalabels:{display:c=>c.dataset.data[c.dataIndex]>0,formatter:v=>v,font:{size:12,weight:'600'}}},
      scales:{x:{stacked:true,beginAtZero:true,ticks:{stepSize:1,color:TICK},grid:{color:GRID}},
        y:{stacked:true,ticks:{color:TICK},grid:{display:false}}}}});
}
stackRef('m2','lg2','bx2','職能','管道',false);
stackRef('m3','lg3','bx3','職能','來源',false);
stackRef('m4','lg4','bx4','職能','職等',true);

// ⑤ 三維交叉表：職等 × 管道 × 來源
(function(){
  const lvKeys=orderLevels([...new Set(ROWS.map(r=>r.level||'未填'))]);
  const srcKeys=[...new Set(ROWS.map(r=>r.src||'未填'))].filter(k=>k!=='未填').sort((a,b)=>cnt('src',b)-cnt('src',a));
  if([...new Set(ROWS.map(r=>r.src||'未填'))].includes('未填'))srcKeys.push('未填');
  let html='<table><thead><tr><th style="text-align:left">職等</th><th style="text-align:left">管道</th>'+srcKeys.map(s=>`<th>${s}</th>`).join('')+'<th>列總</th></tr></thead><tbody>';
  const colTot={};srcKeys.forEach(s=>colTot[s]=0);let grand=0;
  lvKeys.forEach(lv=>{
    const chans=[...new Set(ROWS.filter(r=>(r.level||'未填')===lv).map(r=>r.channel||'未填'))].sort((a,b)=>cnt('channel',b)-cnt('channel',a));
    chans.forEach((ch,ci)=>{
      const rowCells=srcKeys.map(s=>ROWS.filter(r=>(r.level||'未填')===lv&&(r.channel||'未填')===ch&&(r.src||'未填')===s).length);
      const rt=rowCells.reduce((a,b)=>a+b,0);grand+=rt;rowCells.forEach((v,i)=>colTot[srcKeys[i]]+=v);
      const lvLabel=/^\d+$/.test(lv)?'職等'+lv:(lv==='未填'?'未填職等':lv);
      html+='<tr>'+(ci===0?`<td class="grp" rowspan="${chans.length}">${lvLabel}</td>`:'')+`<td class="sub-c">${ch}</td>`
        +rowCells.map(v=>v>0?`<td class="hit">${v}</td>`:'<td class="zero">0</td>').join('')+`<td class="rt">${rt}</td></tr>`;
    });
  });
  html+='</tbody><tfoot><tr><td colspan="2" style="text-align:left">欄總</td>'+srcKeys.map(s=>`<td>${colTot[s]}</td>`).join('')+`<td>${grand}</td></tr></tfoot></table>`;
  document.getElementById('xtab').innerHTML=html;
})();

// ⑥ 月趨勢
{const m={};ROWS.forEach(r=>{const k=r.close_day.slice(0,7);m[k]=(m[k]||0)+1;});const keys=MONTHS.filter(k=>m[k]);
  new Chart(document.getElementById('trend'),{type:'line',data:{labels:keys,datasets:[{data:keys.map(k=>m[k]),borderColor:DARK,backgroundColor:'rgba(21,67,111,.12)',fill:true,tension:.3,pointRadius:3,pointBackgroundColor:DARK}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},datalabels:{display:false}},scales:{x:{ticks:{color:TICK},grid:{display:false}},y:{beginAtZero:true,ticks:{stepSize:1,color:TICK},grid:{color:GRID}}}}});}
</script>
</body>
</html>
