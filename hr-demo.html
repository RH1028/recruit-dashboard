<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Head 視角 — 關缺圖表 Demo（五張相關性 100% 堆疊橫條）</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--p:#7F77DD;--pd:#3C3489;--bg:#F7F6F3;--surf:#fff;--bdr:rgba(0,0,0,.1);--text:#1A1A1A;--muted:#6B6A66;
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;}
body{background:var(--bg);color:var(--text);padding:26px;font-size:14px;line-height:1.5;max-width:1120px;margin:0 auto}
h1{font-size:20px;color:var(--pd)}
.sub{font-size:12px;color:var(--muted);margin:4px 0 20px}
.divider{font-size:13px;font-weight:600;color:var(--pd);margin:24px 0 12px;padding-left:10px;border-left:3px solid var(--p)}
.card{background:var(--surf);border:.5px solid var(--bdr);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.ctitle{font-size:14px;font-weight:600;margin-bottom:2px}
.cnote{font-size:11px;color:var(--muted);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--bg);border-radius:10px;padding:11px 13px}
.kpi .l{font-size:11px;color:var(--muted)}.kpi .v{font-size:23px;font-weight:700;margin-top:2px}.kpi .s{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend i{width:11px;height:11px;border-radius:3px}
.chartbox{position:relative}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<h1>📊 關缺圖表 — HR Head 視角</h1>
<div class="sub">範例資料 120 筆。重點數字 + 五張相關性圖（100% 堆疊橫條）+ 月趨勢。橫條看占比，hover 看實際筆數。</div>

<div class="card">
  <div class="ctitle">① 重點數字</div>
  <div class="cnote">量體與結果一眼看完。</div>
  <div class="kpis" id="kpis"></div>
</div>

<div class="divider">▼ 五張相關性圖（100% 堆疊橫條：一列一條、顏色＝占比）</div>
<div class="grid2">
  <div class="card"><div class="ctitle">② 職能 × 管道</div><div class="cnote">各職能靠哪些管道補人</div><div class="legend" id="lg2"></div><div class="chartbox" id="bx2"><canvas id="c2"></canvas></div></div>
  <div class="card"><div class="ctitle">③ 職能 × 來源</div><div class="cnote">各職能來自哪些來源</div><div class="legend" id="lg3"></div><div class="chartbox" id="bx3"><canvas id="c3"></canvas></div></div>
  <div class="card"><div class="ctitle">④ 職能 × 職等</div><div class="cnote">各職能的職等結構</div><div class="legend" id="lg4"></div><div class="chartbox" id="bx4"><canvas id="c4"></canvas></div></div>
  <div class="card"><div class="ctitle">⑤ 職等 × 管道</div><div class="cnote">各職等靠哪些管道（資深靠誰？）</div><div class="legend" id="lg5"></div><div class="chartbox" id="bx5"><canvas id="c5"></canvas></div></div>
</div>
<div class="card"><div class="ctitle">⑥ 職等 × 來源</div><div class="cnote">各職等來自哪些來源</div><div class="legend" id="lg6"></div><div class="chartbox" id="bx6"><canvas id="c6"></canvas></div></div>

<div class="card"><div class="ctitle">⑦ 月趨勢（依 Close Day）</div><div class="cnote">關缺量隨時間變化</div><div class="chartbox" style="height:230px"><canvas id="trend"></canvas></div></div>

<script>
const FUNCS={'後端工程':'工程部','前端工程':'工程部','資料科學':'AI技術應用組','產品經理':'產品部','行銷企劃':'行銷運營部','業務開發':'業務部','人資':'人力資源部','UI/UX 設計':'產品部'};
const FN=Object.keys(FUNCS);
const RULES={
 'LinkedIn':{lv:['3','3','4','4','5'],src:['主投','官網'],st:['錄取','補缺','錄取']},
 '104':{lv:['1','2','2','3','intern'],src:['主投','官網'],st:['補缺','錄取','補缺']},
 '內部推薦':{lv:['2','3','3','4'],src:['員工推薦','同事'],st:['補缺','錄取']},
 '獵頭':{lv:['4','5','5','6'],src:['獵才_Lydia','獵才_Johnny'],st:['錄取','錄取','補缺']},
 '校園招募':{lv:['intern','intern','1'],src:['台灣大學'],st:['錄取','補缺']},
 '內轉':{lv:['2','3','4'],src:['同事'],st:['內轉補缺','內轉補缺']},
};
const CH=Object.keys(RULES);
const MONTHS=['2025-09','2025-10','2025-11','2025-12','2026-01','2026-02','2026-03'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ROWS=[];
for(let i=0;i<120;i++){const ch=pick(CH),r=RULES[ch],fn=pick(FN);
  ROWS.push({func:fn,dept:FUNCS[fn],channel:ch,src:pick(r.src),level:pick(r.lv),status:pick(r.st),
    close_day:pick(MONTHS)+'-15',days:18+Math.floor(Math.random()*40)});}

const orderLevels=ks=>{const n=ks.filter(k=>/^\d+$/.test(k)).sort((a,b)=>a-b);const it=ks.filter(k=>/intern/i.test(k));const o=ks.filter(k=>n.indexOf(k)<0&&it.indexOf(k)<0).sort();return[...n,...o,...it];};
const lvColor=lv=>{const i=['1','2','3','4','5','6'].indexOf(lv);if(i>=0)return 'hsl(252,68%,'+(78-i*9.6).toFixed(0)+'%)';if(/intern/i.test(lv))return '#0d9488';return '#cbd5e1';};
const PAL=['#7F77DD','#1D9E75','#BA7517','#D85A30','#3b82f6','#a855f7','#ec4899','#14b8a6','#f97316','#64748b'];
const F={'職能':'func','管道':'channel','來源':'src','職等':'level'};
const byTotalDesc=(f,ks)=>ks.sort((a,b)=>ROWS.filter(r=>(r[f]||'(未填)')===b).length-ROWS.filter(r=>(r[f]||'(未填)')===a).length);
const keysOf=dim=>{const f=F[dim];let ks=[...new Set(ROWS.map(r=>r[f]||'(未填)'))];return dim==='職等'?orderLevels(ks):byTotalDesc(f,ks);};
function colorMap(dim){const m={};if(dim==='職等'){keysOf(dim).forEach(k=>m[k]=lvColor(k));}else{keysOf(dim).forEach((k,i)=>m[k]=PAL[i%PAL.length]);}return m;}
const base={responsive:true,maintainAspectRatio:false,animation:false};

// ① KPI
(function(){const n=ROWS.length,by=s=>ROWS.filter(r=>r.status===s).length,pct=x=>Math.round(x/n*100),avg=Math.round(ROWS.reduce((s,r)=>s+r.days,0)/n);
  const kp=[['總關缺數',n,''],['錄取',by('錄取'),pct(by('錄取'))+'%'],['補缺',by('補缺'),pct(by('補缺'))+'%'],['內轉補缺',by('內轉補缺'),pct(by('內轉補缺'))+'%'],['平均報到天數',avg+' 天','Close → 報到']];
  document.getElementById('kpis').innerHTML=kp.map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('');})();

// 通用：100% 堆疊橫條（rowDim 一列、segDim 占比）
function stackBar(canvasId,boxId,legId,rowDim,segDim){
  const rf=F[rowDim],sf=F[segDim];
  const rowKeys=keysOf(rowDim), segKeys=keysOf(segDim), cmap=colorMap(segDim);
  document.getElementById(legId).innerHTML=segKeys.map(s=>`<span><i style="background:${cmap[s]}"></i>${s}</span>`).join('');
  document.getElementById(boxId).style.height=(rowKeys.length*30+40)+'px';
  const tot=rowKeys.map(rk=>ROWS.filter(r=>(r[rf]||'(未填)')===rk).length);
  const datasets=segKeys.map(sv=>{
    const counts=rowKeys.map(rk=>ROWS.filter(r=>(r[rf]||'(未填)')===rk&&(r[sf]||'(未填)')===sv).length);
    return{label:sv,data:counts.map((n,i)=>tot[i]?+(n/tot[i]*100).toFixed(1):0),_counts:counts,backgroundColor:cmap[sv],borderRadius:2};
  });
  new Chart(document.getElementById(canvasId),{type:'bar',data:{labels:rowKeys,datasets},
    options:{...base,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:it=>`${segDim} ${it.dataset.label}：${it.dataset._counts[it.dataIndex]} 筆（${it.parsed.x}%）`}}},
      scales:{x:{stacked:true,max:100,ticks:{callback:v=>v+'%'}},y:{stacked:true}}}});
}
stackBar('c2','bx2','lg2','職能','管道');
stackBar('c3','bx3','lg3','職能','來源');
stackBar('c4','bx4','lg4','職能','職等');
stackBar('c5','bx5','lg5','職等','管道');
stackBar('c6','bx6','lg6','職等','來源');

// ⑦ 月趨勢
{const m={};ROWS.forEach(r=>{const k=r.close_day.slice(0,7);m[k]=(m[k]||0)+1;});const keys=MONTHS.filter(k=>m[k]);
  new Chart(document.getElementById('trend'),{type:'line',data:{labels:keys,datasets:[{data:keys.map(k=>m[k]),borderColor:'#7c6cf0',backgroundColor:'rgba(124,108,240,.15)',fill:true,tension:.3,pointRadius:3}]},options:{...base,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});}
</script>
</body>
</html>
